<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>layout03 - float</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
        }

        #wrap {
            width: 900px;
            background-color: #f70202;
            margin: 0 auto;
        }
        #header {
            width: 100%;
            /* %는 상대값. 부모의 속성을 물려받음 */
            height: 80px;
            background-color: #18ffd9;
            }
        #main {
            width: 100%;
            overflow: hidden;
            /* overflow: hidden;은 자식을 감싼다. 부모한테 줌 */
        }
        #main #section01 {
            width: 300px;
            height: 500px;
            background-color: #fc2bb6;
            float: left;
        }
        #main #section02 {
            width: 300px;
            height: 500px;
            background-color: #ff5e00;
            float: left;
        }
        #main #section03 {
            width: 300px;
            height: 500px;
            background-color: #0c24fd;
            float: left;
        }
        #footer {
            width: 100%;
            height: 80px;
            background-color: #7c36ff
        }
    </style>
</head>
<body>
    <div id="wrap">
        <header>
            <header id="header">header</header>
            <main id="main">
                <section id="section01">section01</section>
                <section id="section02">section02</section>
                <section id="section03">section03</section>
            </main>
            <footer id="footer">footer</footer>
        </header>
    </div>
</body>
</html>
