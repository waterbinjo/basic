<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    #container {
        width: 80%;
        height: 600px;
        background-color: #faf600;
        display: flex;
        justify-content: center;
        align-content: center;
        /*
        align-content는 여러줄일 때
        align-items은 한 줄일 때 씀
        */
        flex-wrap: wrap;
        /* 강제로 줄 바꿈 */
    }
    #container > div {
        width: 100px;
        height: 100px;
        background-color: #fd0ce9;
        border: 1px solid #000;
        box-sizing: border-box;
        font-size: 25px;
        font-weight: bold;

        /* 텍스트를 정렬한 것 */
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .box1{
        order: 3;
        /*
        order는 순번을 변경해줌
        order를 먹여준 것들 중에 작은 숫자가 앞에 있고, 큰 숫자가 뒤로 옴(서로 비교)
        */
    }
    .box2{
        order: 2;
    }
    .box3{
        order: 10;
    }
    .box4{
        order: 1;
    }
    </style>
</head>
<body>
    
    <div id="container">
        <div class="box1">1</div>
        <div class="box2">2</div>
        <div class="box3">3</div>
        <div class="box4">4</div>
    </div>
</body>
</html>
