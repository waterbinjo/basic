<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>layout - float</title>
        <style>
            * {
                margin: 0;
                padding: 0;
            }

            #wrap {
                width: 900px;
                margin: auto; /* 암기!!!!!!!! 브라우저의 가운데 */
                /*
                여기에 height값을 주면 마진에도 백그라운드 컬러가 됨
                부모한테는 height값을 주지 않는 것이 맞음. */
            }
            #header {
                width: 900px;
                height: 80px;
                background-color: #e90a0a;
                margin-bottom: 10px;
                /* nav, content에 마진값을 함께 주려면 header에 마진을 주면 둘 다 마진을 줌. */
            }
            #nav {
                width: 300px;
                height: 500px;
                background-color: #00ffea;
                float: left; 
                margin-right: 10px;
                /*
                float은 nav, content 둘 다 해야함.
                가로로 더 많아지면 전부 줘야함.
                근데 이걸 주는 순간 형제 속성인 'footer'의 색상이 없어짐⭐ */
            }
            #content {
                width: 590px;
                /*
                전체 900px(wrap)에서 nav와 header의 마진값이 추가 되었으니 그만큼 크기가 작아져야함
                (마진+크기 = 전체 크기)
                */
                height: 500px;
                background-color: #a2ff37;
                float: left;
                margin-bottom: 10px;
            }
            #footer {
                width: 900px;
                height: 80px;
                background-color: #ff139d;
                clear: both;
                /* clear: both는 형제의 float의 속성을 차단 */
            }
        </style>
    </head>

    <body>
        <!-- #wrap -->
        <div id="wrap">
            <!-- 그냥 header, nav, section, footer만 써도 괜찮음. 지금은 id값으로 이름을 준 거임 -->
            <header id="header">header</header>
            <nav id="nav">nav</nav>
            <section id="content">content</section>
            <footer id="footer">footer</footer>
        </div>
    </body>
</html>
