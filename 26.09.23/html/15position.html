<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>
            * {
                margin: 0;
                padding: o;
            }

            div {
                width: 100px;
                height: 100px;
            }
            #box01 {
                background-color: #ff8800;
            }
            #box02 {
                background-color: #0000ff;
                position: absolute;
                /* 위치는 이동함. 다만, 본래 영역은 사라지지 않음 */
                left:10px;
                top: 10px;
                z-index: 100;
                /* 층을 결정함. 1을 하든 100을 하든 상관 없음. 숫자가 클 수록 먼저옴 */
            }
            #box03 {
                background-color: #00ff22;
                position: absolute;
                /*
                브라우저의 시작점을 0.0(왼쪽 위끝)으로 설정
                본래 영역까지 사라짐, 이동함
                */
                left: 20px;
                top: 20px;
                z-index: 200;
            }
            #box04 {
                background-color: #ff0095;
                position: absolute;
                top: 50px;
                left: 50px;
            }
            
        </style>
    </head>
    <body>
        <!-- #box$$*4{$} -->
        <div id="box01">1</div>
        <div id="box02">2</div>
        <div id="box03">3</div>
        <div id="box04">4</div>

        <!--
        position 종류
        1) static
        2) absolute
        3) reletive
        4) fixed

        오브젝트끼리 겹치는 건 포지션만 가능!!!!!⭐ border 안됨.
        -->
    </body>
</html>
