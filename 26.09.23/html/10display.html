<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>
            .tomato {
                display: none;
                /* 토마토 텍스트와 공간 모두 사라짐 */
            }
            .cheese {
                visibility: hidden;
                /* 텍스트는 사라졌지만, 공간은 남아있음 */
            }
            .yang {
                opacity: 0;
                /* 투명도 : 0 ~ 1 */
            }
        </style>
    </head>
    <body>
        <div>햄버거빵</div>
        <div class="cheese">치즈</div>
        <div>소고기패티</div>
        <div class="tomato">토마토</div>
        <div class="yang">양상추</div>
        <div>햄버거빵</div>
    </body>
</html>
