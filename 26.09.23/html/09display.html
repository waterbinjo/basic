<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            width: 100px;
            height: 100px;
            background-color: red;
            border: 2px solid #000;
            
            display: inline-block;
            /* 가로로 각각의 블록으로 나뉨 */
        }
        span {
            display: block;
            /* 세로로 떨어짐 */
            width: 100px;
            height: 100px;
            background-color: yellow;
        }
        h1, p {
            display: inline;
        }
        img {
            display: block;
        }
        /*
        block(브라우저 전체 차지): div, p, h1~hn, form, ul, li
        inline(해당 요소 공간만 차지): span, img, b, i, em, strong, input
        inline-block: inline속성과 block속성을 함께 가지고 있음
        */
    </style>
</head>
<body>
    <!-- 블록/ 인라인 -->
    <div>div는 무속성. 블록</div>
    <div>블록속성은 윗줄에 맞춰짐</div>
    <div>블록ddddddddddd</div>
    <div>블록ddddddddddd</div>
    <div>블록ddddddddddddd</div>

    <h1>dadasdada</h1>
    <p>dsdasdas</p>

    <span>인라인</span><span>인라인속성은 아랫줄에 맞춰짐</span><span>인라인</span>

    <hr>
    <img src="../img/cat01.png" alt="" width="200" />
    <img src="../img/cat02.jpg" alt="" width="200" />
    <img src="../img/cat03.jpg" alt="" width="200" />
    <img src="../img/cat04.jpg" alt="" width="200" />
    <img src="../img/cat05.jpg" alt="" width="200" />
</body>
</html>
