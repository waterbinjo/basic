<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
    </head>
    <body>
        <h1>이미지 가져오기</h1>
        <a href="https://kr.pinterest.com/" target="_blank">
            <img src="../img/cat01.png" alt="고양이 1" width="300" height="200" />
        </a>
        <img src="../img/cat02.jpg" alt="고양이 2" width="300" height="200" />
        <img src="../img/cat03.jpg" alt="고양이 3" width="300" height="200" />
        <img src="../img/cat04.jpg" alt="고양이 4" width="300" height="200" />
        <img src="../img/cat05.jpg" alt="고양이 5" width="300" height="200" />
        <!-- 
        alt: 대체 텍스트
        시각 장애인을 위해 스크린 리더기로 이미지를 읽는다
        => 웹 접근성, 웹표준
        만약 이미지가 유실이 된다면 alt=""안에 입력된 대체 텍스트가 표시된다 -->
    </body>
</html>
