<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ol>
        <li>메뉴1</li>
        <li>메뉴2</li>
        <li>메뉴3</li>
    </ol>
    <!-- 리스트 태그, 숫자로 나타냄 -->
    
    <ul>
        <li>MENU1</li>
        <li>MENU2</li>
        <li>MENU3</li>
    </ul>
    <!-- 리스트 태그, 원점으로 나타냄. 리스트 태그 중 가장 많이 씀.  -->

    <dl>
        <dt>에스프레소</dt>
        <dd>- 커피의 기본, 커피읜 원액이다.</dd>
        <dt>아메리카노</dt>
        <dd>- 에스프레소에 물을 넣은 것</dd>
        <dt>카페라떼</dt>
        <dd>- 커피에 우유를 섞은 것</dd>
    </dl>
    <!-- 리스트 태그, 기호 없음. dd는 설명문구 작성   -->

</body>
</html>
