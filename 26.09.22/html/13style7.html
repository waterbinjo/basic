<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: aquamarine;
        }
        p {
            color: red;
        }
        .color01 {
            background-color: blue;
        }
        .color02 {
            background-color: #1c1c1c;
        }
        .color03 {
            background-color: rgb(0 0 0);
        }
        .color04 {
            background-color: rgb(20, 100, 200, 0.4);
        }
        /*
        색상 alpha : 0 ~ 1
        색상 변경할 때 네모 컬러박스 선택.
        핵사코드로 바꾸고 싶으면 맨위 컬러값 클릭하면 핵사코드로 바뀜 */
        .color05 {
            color: #d9ff00;
            background-color: #000;
            opacity: 1;
        }
        /*
        opacity : 0 ~ 1 */
    </style>
</head>
<body>
    <h1>CSS Color Chart</h1>
    <!-- p.color$$*10{COLOR$$} -->
    <p class="color01">COLOR01</p>
    <p class="color02">COLOR02</p>
    <p class="color03">COLOR03</p>
    <p class="color04">COLOR04</p>
    <p class="color05">COLOR05</p>
    <p class="color06">COLOR06</p>
    <p class="color07">COLOR07</p>
    <p class="color08">COLOR08</p>
    <p class="color09">COLOR09</p>
    <p class="color10">COLOR10</p>
</body>
</html>
