<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        성별 : <br>
        <p>버튼을 정확히 선택</p>
        남성 <input type="radio" name="gender"><br>
        여성 <input type="radio" name="gender"><br>
        <!-- 이 형식은 버튼을 정확히 선택해야만 선택이 가능함 -->
        
        <hr>
        <p>남성, 여성 텍스트를 눌러도 선택</p>
        <label for="male">남성</label>
        <input type="radio" name="gender" id="male"><br>
        
        <label for="female">여성</label>
        <input type="radio" name="gender" id="female"><br>
        <!--
        radio 버튼은 같은 name 속성을 가진 경우 하나만 선택할 수 있음 : 남성, 여성 중 하나만 선택 가능
        label의 for와 input의 id는 일치해야 함 : 이걸 추가하면 텍스트를 눌러도 선택 가능
        남성, 여성. 두 개의 radio의 name 속성이 일치해야함⭐
        radio 속성은 중복선택이 불가능
        -->
    </form>
    <hr>
    <form>
        <p>좋아하는 과일을 선택하세요</p>
        <input type="checkbox" name="fruit" value="apple"> 사과<br>
        <input type="checkbox" name="fruit" value="orange"> 오렌지<br>
        <input type="checkbox" name="fruit" value="strawberry"> 딸기<br>
        <input type="checkbox" name="fruit" value="watermelon"> 수박<br>
        <input type="checkbox" name="fruit" value="grape"> 포도<br>
        <input type="checkbox" name="fruit" value="peach"> 복숭아<br>
        <!--
        name 속성이 같아야 같은 체크박스 그룹으로 인식됨⭐
        단, value 속성은 각각 다르게 설정해야 함⭐
        왜냐하면 value 속성은 서버로 전송될 때 사용되는 값이기 때문 : ex) fruit 중 apple만 전송.
        -->
        <input type="submit" value="입력완료" onclick="alert('입력완료했습니다')">
    </form>
</body>
</html>
